<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Late Orders, Lost Stars — Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Print layout: fixed Letter pages, 0.65in margins, a 12-column feel via simple grids; ink-on-paper palette, orange reserved for "late". */
:root {
  --paper: #ffffff; --tint: #f3f5f8; --ink: #0f1722; --ink-2: #3f4a59; --ink-3: #6b7685; --rule: #d9dee6;
  --navy: #13294b; --accent: #2a78d6; --accent-soft: #dbe8f9; --hot: #e2622b; --hot-soft: #fbe3d8; --good: #1f7a4a;

}
@page { size: Letter; margin: 0; }

.page { width: 8.5in; height: 11in; padding: 0.62in 0.68in 0.8in; background: var(--paper); position: relative; overflow: hidden; margin: 0 auto 12px; break-after: page; display: flex; flex-direction: column; gap: 18px; }
.page:last-child { break-after: auto; }
@media print { html, body { background: var(--paper); } .page { margin: 0; } }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.12; text-wrap: balance; }

h3 { font-size: 11pt; font-weight: 600; }

b { font-weight: 600; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.lead { font-size: 11pt; color: var(--ink-2); max-width: 6.4in; }
.foot { position: absolute; left: 0.68in; right: 0.68in; bottom: 0.38in; display: flex; justify-content: space-between; font: 7pt/1 var(--mono); color: var(--ink-3); border-top: 1px solid var(--rule); padding-top: 8px; letter-spacing: 0.04em; }
.sechead { display: grid; gap: 6px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.sechead .eyebrow { color: var(--accent); }

/* ---------- cover ---------- */
.cover { padding: 0; gap: 0; }
.cover .band { background: var(--navy); color: #fff; padding: 0.75in 0.68in 0.55in; display: grid; gap: 18px; }
.cover .band .eyebrow { color: #9fb6d8; }
.cover h1 { font-size: 44pt; font-weight: 700; letter-spacing: -0.025em; line-height: 1.0; }
.cover .sub { font-size: 13pt; color: #d6e0ee; max-width: 5.8in; line-height: 1.45; }
.cover .hero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 10px; border-top: 1px solid #3b5580; }
.cover .hero div { padding: 14px 16px 0 0; display: grid; gap: 4px; }
.cover .hero .num { font-size: 24pt; font-weight: 500; color: #fff; }
.cover .hero .num.hot { color: #ffad85; }
.cover .hero .lab { font-size: 8.5pt; color: #b9c8de; line-height: 1.4; }
.cover .body { padding: 0.5in 0.68in 0; display: grid; grid-template-columns: 1.35fr 1fr; gap: 0.45in; }
.cover .body h3 { font-size: 9pt; font-family: var(--mono); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.cover .q { font-family: var(--display); font-size: 15pt; line-height: 1.3; color: var(--ink); }
.cover .meta { display: grid; gap: 16px; align-content: start; }
.cover .author { border-left: 3px solid var(--hot); padding-left: 14px; display: grid; gap: 3px; }
.cover .author .name { font-family: var(--display); font-size: 17pt; font-weight: 600; }
.cover .author .role { font-size: 9pt; color: var(--ink-2); }
.cover .author .contact { font: 8pt/1.6 var(--mono); color: var(--ink-2); margin-top: 4px; word-break: break-all; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tools span { font: 7.5pt/1 var(--mono); border: 1px solid var(--rule); border-radius: 3px; padding: 5px 7px; color: var(--ink-2); }
.cover .toc { padding: 0.35in 0.68in 0; }

.cover .src { position: absolute; left: 0.68in; right: 0.68in; bottom: 0.4in; font-size: 7.5pt; color: var(--ink-3); border-top: 1px solid var(--rule); padding-top: 8px; }

/* ---------- blocks ---------- */
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.panel { border: 1px solid var(--rule); border-radius: 4px; padding: 13px 14px 12px; display: grid; gap: 10px; break-inside: avoid; }

.psub { font-size: 7.8pt; color: var(--ink-3); margin-top: 1px; }
.hbars { display: grid; gap: 9px; }
.hbar { display: grid; grid-template-columns: 1.75in 1fr 0.5in; align-items: center; gap: 8px; font-size: 8.5pt; }
.cols2 .hbar { grid-template-columns: 0.8in 1fr 0.45in; }
.hbar .lab { color: var(--ink-2); }
.track { height: 13px; background: var(--tint); border-radius: 0 3px 3px 0; position: relative; display: block; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 0 3px 3px 0; }
.hi .fill { background: var(--hot); }
.val { font: 8pt var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.pair .track { height: 7px; }
.pair-rows { display: grid; gap: 2px; }
.legend { display: flex; gap: 14px; font-size: 7.8pt; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stats.two { grid-template-columns: 1fr 1fr; }
.stat { border-top: 3px solid var(--accent); padding-top: 8px; display: grid; gap: 3px; }
.stat.hot { border-color: var(--hot); }
.stat .num { font-size: 17pt; font-weight: 500; }
.stat .lab { font-size: 8pt; color: var(--ink-2); line-height: 1.4; }
.callout { background: var(--tint); border-radius: 4px; padding: 11px 13px; font-size: 8.8pt; color: var(--ink-2); line-height: 1.5; }
.callout b { color: var(--ink); }
.callout.hot { background: var(--hot-soft); }
.callout .k { font: 500 7pt/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 5px; }
.so { font-family: var(--display); font-size: 12pt; line-height: 1.35; color: var(--ink); padding-left: 12px; border-left: 3px solid var(--ink); }
.text { font-size: 9.6pt; color: var(--ink-2); max-width: 6.6in; }
.text b { color: var(--ink); }
.cols { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; align-items: end; height: 1.55in; border-bottom: 1px solid var(--rule); }
.col { background: var(--accent); border-radius: 3px 3px 0 0; position: relative; }
.col.hi { background: var(--hot); }
.col .tag { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font: 7pt var(--mono); color: var(--ink-2); padding-bottom: 2px; white-space: nowrap; }
.caxis { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; font: 7pt var(--mono); color: var(--ink-3); text-align: center; }
svg.line { width: 100%; height: auto; display: block; }
svg.line text { fill: var(--ink-3); font: 10px var(--mono); }
svg.line .grid { stroke: var(--rule); }
svg.line .path { fill: none; stroke: var(--accent); stroke-width: 2; }
svg.line .area { fill: var(--accent-soft); }
svg.line .dot { fill: var(--hot); stroke: #fff; stroke-width: 2; }
table { border-collapse: collapse; width: 100%; font-size: 8.3pt; }
th, td { text-align: left; padding: 4.5px 8px 4.5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 500 6.8pt/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.sel td { font-weight: 600; background: var(--accent-soft); }
.pill { font: 500 6.5pt/1 var(--mono); padding: 2px 6px; border-radius: 99px; border: 1px solid currentColor; }
.pill.pass { color: var(--good); } .pill.handled { color: var(--accent); }
dl.spec { display: grid; grid-template-columns: 1.25in 1fr; gap: 7px 14px; margin: 0; font-size: 8.8pt; }
dl.spec dt { font: 500 7pt/1.6 var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }
dl.spec dd { margin: 0; color: var(--ink); }
.recs { display: grid; gap: 10px; }
.rec { display: grid; grid-template-columns: 0.42in 1fr 1.75in; gap: 12px; align-items: start; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.rec .no { font: 600 18pt/1 var(--display); color: var(--accent); }
.rec h3 { margin-bottom: 3px; }
.rec p { font-size: 9pt; color: var(--ink-2); }
.rec .impact { font-size: 8pt; color: var(--ink-2); background: var(--tint); border-radius: 4px; padding: 8px 10px; line-height: 1.45; }
.rec .impact .num { display: block; font-size: 11.5pt; color: var(--ink); white-space: nowrap; margin-bottom: 2px; }
.flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.flow div { border: 1px solid var(--rule); border-top: 3px solid var(--navy); border-radius: 3px; padding: 7px 8px; font-size: 7.8pt; line-height: 1.35; color: var(--ink-2); }
.flow div b { display: block; color: var(--ink); font-size: 8.3pt; margin-bottom: 2px; }
ul.lim { margin: 0; padding-left: 15px; display: grid; gap: 4px; font-size: 8.8pt; color: var(--ink-2); }
.exec { display: grid; gap: 10px; }
.exec-item { display: grid; grid-template-columns: 1.3in 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.exec-item .num { font-size: 18pt; font-weight: 500; white-space: nowrap; }
.exec-item .num.hot { color: var(--hot); }
.exec-item h3 { font-size: 10.5pt; margin-bottom: 2px; }
.exec-item p { font-size: 9pt; color: var(--ink-2); }
.small { font-size: 7.8pt; color: var(--ink-3); }
a { color: var(--accent); text-decoration: none; }
.refs { display: grid; gap: 0; }
.ref { display: grid; grid-template-columns: 0.42in 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); break-inside: avoid; }
.ref .no { font: 500 9pt/1.4 var(--mono); color: var(--accent); }
.ref .cite { font-size: 9.3pt; line-height: 1.45; }
.ref .url { font: 7.6pt/1.5 var(--mono); color: var(--accent); word-break: break-all; display: block; margin-top: 2px; }
.ref .use { font-size: 8.2pt; color: var(--ink-2); margin-top: 4px; }
.ref .use b { color: var(--ink); font-weight: 600; }
.refgroup { font: 500 7.5pt/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding-top: 10px; }
</style></head>
<body>
<script>const D = /*__DATA__*/null; const AUTHOR = /*__AUTHOR__*/null;</script>
<div id="root"></div>
<script>
const F = D.f, E = D.exp, H = F.headline;
const fmtInt = n => Math.round(n).toLocaleString("en-US");
const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";
const brl = n => "R$" + (n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : fmtInt(n));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const L = F.late_to_reviews, R = F.late_to_repurchase, P = F.payments, I = F.installments, RC = F.reconciliation,
      S = F.sellers, T = F.review_themes, M = F.risk_model, Q = F.data_quality, Z = F.sizing, sim = E.simulation_checks;
const TOTAL = 10;
const foot = n => `<div class="foot"><span>${esc(AUTHOR.name)} · Late Orders, Lost Stars</span><span>Data: Olist marketplace orders [1]</span><span>${String(n).padStart(2, "0")} / ${String(TOTAL).padStart(2, "0")}</span></div>`;
const head = (eb, title) => `<div class="sechead"><div class="eyebrow">${eb}</div><h2>${title}</h2></div>`;
function hbars(rows, { max, fmt = v => pct(v), hi = () => false } = {}) {
  const m = max ?? Math.max(...rows.map(r => r.value)) * 1.08;
  return `<div class="hbars">` + rows.map(r => `<div class="hbar ${hi(r) ? "hi" : ""}"><span class="lab">${esc(r.label)}</span><span class="track"><span class="fill" style="width:${(r.value / m * 100).toFixed(2)}%"></span></span><span class="val">${fmt(r.value)}</span></div>`).join("") + `</div>`;
}
const names = { credit_card: "Credit card", boleto: "Boleto", voucher: "Voucher", debit_card: "Debit card" };

function lineSvg() {
  const W = 640, Hh = 190, pl = 38, pr = 10, pt = 14, pb = 26, rows = D.monthly, n = rows.length, ymax = 0.25;
  const x = i => pl + i * (W - pl - pr) / (n - 1), y = v => pt + (1 - v / ymax) * (Hh - pt - pb);
  let g = "";
  for (const t of [0, .05, .10, .15, .20, .25]) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 6}" y="${y(t) + 3.5}" text-anchor="end">${Math.round(t * 100)}%</text>`;
  rows.forEach((r, i) => { if (i % 3 === 0) g += `<text x="${x(i)}" y="${Hh - 6}" text-anchor="middle">${r.purchase_month}</text>`; });
  const pts = rows.map((r, i) => `${x(i).toFixed(1)},${y(r.late_delivery_rate).toFixed(1)}`);
  g += `<polygon class="area" points="${x(0)},${y(0)} ${pts.join(" ")} ${x(n - 1)},${y(0)}"/><polyline class="path" points="${pts.join(" ")}"/>`;
  const pk = rows.reduce((a, r, i) => r.late_delivery_rate > rows[a].late_delivery_rate ? i : a, 0);
  g += `<circle class="dot" cx="${x(pk)}" cy="${y(rows[pk].late_delivery_rate)}" r="4.5"/><text x="${x(pk) + 8}" y="${y(rows[pk].late_delivery_rate) - 4}" style="fill:var(--ink-2)">${rows[pk].purchase_month} peak: ${pct(rows[pk].late_delivery_rate)}</text>`;
  return `<svg class="line" viewBox="0 0 ${W} ${Hh}">${g}</svg>`;
}

const pages = [];

// 1 — cover
pages.push(`<section class="page cover">
  <div class="band">
    <div class="eyebrow">Analytics portfolio · Independent project · ${esc(AUTHOR.date)}</div>
    <h1>Late Orders,<br>Lost Stars</h1>
    <p class="sub">Payments and delivery analytics on ${fmtInt(H.orders)} real marketplace orders: what drives bad reviews, how slow payments make orders late, and how to prove a fix with an experiment.</p>
    <div class="hero">
      <div><span class="num hot">+${L.adjusted_effect_pp} pp</span><span class="lab">chance of a 1–2 star review when an order arrives late, after controls</span></div>
      <div><span class="num">+${P.slow_pay_relative_increase_pct}%</span><span class="lab">late-delivery risk when payment approval takes over 24 hours</span></div>
      <div><span class="num">${fmtInt(E.n_per_arm)}</span><span class="lab">orders per arm for the designed A/B test, validated by ${fmtInt(sim.simulations)} simulations</span></div>
    </div>
  </div>
  <div class="body">
    <div><h3>The question</h3><p class="q">Which payment and fulfilment problems cost a marketplace its customers' trust, and how would we prove that a fix works?</p></div>
    <div class="meta">
      <div class="author"><span class="name">${esc(AUTHOR.name)}</span>${AUTHOR.role ? `<span class="role">${esc(AUTHOR.role)}</span>` : ""}${AUTHOR.contact.length ? `<span class="contact">${AUTHOR.contact.map(esc).join("<br>")}</span>` : ""}</div>
      <div><h3>Built with</h3><div class="tools"><span>SQL · SQLite</span><span>Python · pandas</span><span>statsmodels</span><span>scikit-learn</span><span>YAML metric layer</span><span>Claude (AI-assisted)</span></div></div>
    </div>
  </div>
  <div class="toc"><h3 class="eyebrow" style="margin-bottom:8px">Contents</h3><ol>
    <li><span>Executive summary</span><span>02</span></li><li><span>Model: flagging late orders early</span><span>06</span></li>
    <li><span>Finding 1 · Late delivery and reviews</span><span>03</span></li><li><span>Experiment design</span><span>07</span></li>
    <li><span>Finding 2 · Payments</span><span>04</span></li><li><span>Recommendations</span><span>08</span></li>
    <li><span>Finding 3 · Sellers and complaints</span><span>05</span></li><li><span>How it was built · Limits</span><span>09</span></li>
    <li><span>Sources and references</span><span>10</span></li>
  </ol></div>
  <div class="src">Data: Olist, Brazilian E-Commerce Public Dataset [1] · ${fmtInt(H.orders)} orders, ${fmtInt(H.sellers)} sellers, Jan 2017 – Aug 2018. Canadian context: Payments Canada, Canadian Payment Methods and Trends Report 2025 [3]. Full references on page 10.</div>
</section>`);

// 2 — executive summary
pages.push(`<section class="page">
  ${head("Executive summary", "Late delivery is the problem to fix, and payments are part of the cause")}
  <p class="lead">Across ${fmtInt(H.orders)} orders and ${brl(H.gmv_brl)} in GMV, ${H.late_delivery_rate_pct}% of deliveries arrived after the promised date and ${H.low_review_rate_pct}% of reviews were 1–2 stars. Five results shape the recommendations.</p>
  <div class="exec">
    <div class="exec-item"><span class="num hot">+${L.adjusted_effect_pp} pp</span><div><h3>A late delivery is the strongest driver of bad reviews</h3><p>1–2 star rate goes from ${L.low_review_on_time_pct}% on time to ${L.low_review_late_pct}% late, and ${L.low_review_8plus_days_late_pct}% at 8+ days late. Controlled for state, category, value and month.</p></div></div>
    <div class="exec-item"><span class="num">${P.boleto_avg_approval_hours}h</span><div><h3>Slow payment methods eat into the delivery window</h3><p>Boleto takes ${P.boleto_avg_approval_hours} hours to approve vs ${P.card_avg_approval_hours} for cards. Orders approved after 24 hours are ${P.slow_pay_relative_increase_pct}% more likely to arrive late.</p></div></div>
    <div class="exec-item"><span class="num">${I.seven_plus_gmv_share_pct}%</span><div><h3>Installments carry the high-ticket orders</h3><p>7+ installment orders are ${I.seven_plus_order_share_pct}% of card orders but ${I.seven_plus_gmv_share_pct}% of card GMV. They also explain ${RC.share_explained_by_installment_interest_pct}% of payment reconciliation breaks.</p></div></div>
    <div class="exec-item"><span class="num hot">${S.at_risk_share_of_late_pct}%</span><div><h3>A small seller group drives a large share of the damage</h3><p>${S.at_risk_sellers} at-risk sellers handle ${S.at_risk_order_share_pct}% of orders but ${S.at_risk_share_of_late_pct}% of late deliveries and ${S.at_risk_share_of_low_reviews_pct}% of 1–2 star reviews.</p></div></div>
    <div class="exec-item"><span class="num">${M.auc}</span><div><h3>Late orders can be flagged at payment approval</h3><p>Out-of-time AUC ${M.auc}; the top 30% risk orders hold ${M.top3_deciles_capture_pct}% of late deliveries, which makes a targeted experiment possible.</p></div></div>
  </div>
  <div class="cols2" style="margin-top:4px">
    <div class="callout"><span class="k">Recommendation</span><b>Start the delivery clock at payment approval</b>, run a <b>proactive delay-alert A/B test</b> on high-risk orders (${fmtInt(E.total_n)} orders, about ${E.duration_weeks_at_2018_volume} weeks), and put the ${S.at_risk_sellers} at-risk sellers on a fulfilment plan.</div>
    <div class="callout"><span class="k">Reported as found</span>Late delivery does <b>not</b> significantly change 180-day repurchase (p = ${R.p_value}). Repeat buying is rare here (${H.repurchase_rate_180d_pct}%), so reviews are the outcome to manage.</div>
  </div>
  ${foot(2)}
</section>`);

// 3 — finding 1
pages.push(`<section class="page">
  ${head("Finding 1 · Customer experience", "A late delivery is the strongest driver of bad reviews")}
  <p class="so">On-time orders get a 1–2 star review ${L.low_review_on_time_pct}% of the time. Late orders get one ${L.low_review_late_pct}% of the time.</p>
  <div class="panel"><div><div class="ptitle">Share of reviews scored 1–2 stars, by days past the promised date</div><div class="psub">Delivered orders with a review, Jan 2017 – Aug 2018 · n = ${fmtInt(D.late.reduce((a, r) => a + r.orders, 0))}</div></div>
    ${hbars(D.late.map(r => ({ label: r.bucket, value: r.low_review_rate })), { max: 1, hi: r => r.label !== "On time" })}
    <table><thead><tr><th>Delay</th><th class="n">Orders</th><th class="n">Avg stars</th><th class="n">1–2 star rate</th></tr></thead><tbody>${D.late.map(r => `<tr><td>${r.bucket}</td><td class="n">${fmtInt(r.orders)}</td><td class="n">${r.avg_review.toFixed(2)}</td><td class="n">${pct(r.low_review_rate)}</td></tr>`).join("")}</tbody></table>
  </div>
  <div class="stats two">
    <div class="stat hot"><span class="num">+${L.adjusted_effect_pp} pp</span><span class="lab">effect of a late delivery on the chance of a 1–2 star review (95% CI ${L.adjusted_effect_ci_pp[0]}–${L.adjusted_effect_ci_pp[1]}), OLS (statsmodels [5]) with state, category, value and month fixed effects, robust SE, n = ${fmtInt(L.n)}</span></div>
    <div class="stat"><span class="num">${L.avg_review_on_time} → ${L.avg_review_late}</span><span class="lab">average review score, on-time vs late orders</span></div>
  </div>

  <p class="text"><b>So what:</b> because the effect is large and rises with every day of delay, even a partial fix to lateness moves reviews. The next question is what makes orders late in the first place.</p>
  ${foot(3)}
</section>`);

// 4 — finding 2
pages.push(`<section class="page">

    <div class="panel"><div><div class="ptitle">Approved within 24 hours</div><div class="psub">By primary payment method</div></div>
      ${hbars(D.pay.map(r => ({ label: names[r.payment_type], value: r.approved_24h })), { max: 1, hi: r => r.label === "Boleto" })}
      <div class="small">Avg approval: boleto ${P.boleto_avg_approval_hours}h · card ${P.card_avg_approval_hours}h. Boleto is a bank slip paid in cash or online banking.</div></div>
    <div class="panel"><div><div class="ptitle">Late-delivery rate by approval time</div><div class="psub">Hours from purchase to payment approval</div></div>

  </div>
  <div class="callout"><span class="k">Reconciliation</span>Payment totals matched items plus freight on all but <b>${RC.breaks}</b> of ${fmtInt(RC.orders_checked)} orders (${RC.break_rate_pct}%). <b>${RC.breaks_from_installment_interest}</b> of those breaks (${RC.share_explained_by_installment_interest_pct}%) were installment card orders where the buyer paid interest on top; boleto had ${RC.boleto_breaks}.</div>
  ${foot(4)}
</section>`);

      <div class="stats two"><div class="stat"><span class="num">${sim.aa_false_positive_rate_pct}%</span><span class="lab">A/A false-positive rate (target 5%)</span></div><div class="stat"><span class="num">${sim.simulated_power_pct}%</span><span class="lab">power with a −2 pp effect injected (target 80%)</span></div></div>

// 8 — recommendations
pages.push(`<section class="page">
  ${head("Recommendations", "What to do, and what it is worth")}

    <div class="rec"><span class="no">1</span><div><h3>Start the delivery clock at payment approval</h3><p>For slow methods such as boleto, quote the delivery date from approval, or add the expected approval time to the promise shown at checkout.</p></div><div class="impact"><span class="num">~${fmtInt(Z.slow_pay_late_orders_avoidable_per_year)} late orders</span>and ~${fmtInt(Z.slow_pay_low_reviews_avoidable_per_year)} 1–2 star reviews avoided per year at 2017–18 volume</div></div>
    <div class="rec"><span class="no">2</span><div><h3>Run the proactive delay-alert test</h3><p>Score each order at approval and randomize the top 30% by risk. Ship only if 1–2 star reviews fall and no guardrail worsens.</p></div><div class="impact"><span class="num">${fmtInt(E.total_n)} orders</span>about ${E.duration_weeks_at_2018_volume} weeks here; days at a large payments processor</div></div>
    <div class="rec"><span class="no">3</span><div><h3>Put at-risk sellers on a fulfilment plan</h3><p>Share the seller scorecard, set late-rate targets, and review the ${S.at_risk_sellers} sellers monthly.</p></div><div class="impact"><span class="num">~${fmtInt(S.excess_late_orders_vs_platform)} late orders</span>and ~${fmtInt(S.low_reviews_avoidable_if_fixed)} bad reviews over 20 months, protecting ${brl(S.at_risk_gmv_brl)} GMV</div></div>
    <div class="rec"><span class="no">4</span><div><h3>Flag “delivered but not received” complaints</h3><p>Route them to proof-of-delivery checks before they become disputes, and track the rate by carrier and seller.</p></div><div class="impact"><span class="num">${T.delivery_issue_share_among_on_time_orders_pct}%</span>of bad reviews on “on-time” orders describe a delivery problem</div></div>
  </div>
  <div class="callout"><span class="k">Why this matters in Canada</span>Canadians made <b>22.5 billion payments worth $12.2 trillion</b> in 2024, and <b>60%</b> bought something online in a given month; online purchases are expected to reach <b>$96.7 billion by 2028</b>. As the Real-Time Rail arrives (49% of Canadians find real-time payments appealing), merchants will mix instant and slower bank-rail payments at checkout. That is when a payment-aware delivery promise pays off. <span class="small">Sources: Payments Canada 2025 report [3], PDF pp. 7, 16, 18.</span></div>
  <p class="text small">Sizing uses the controlled effects above and treats them as causal; they are observational, which is why recommendation 2 is a randomized test.</p>
